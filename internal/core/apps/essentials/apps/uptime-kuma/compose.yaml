services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8-rootless@sha256:880cb8fd62ce6c00a378f450c6ad7561b7d164b61ea8bcf6a8f39239075442c0
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 512m
    ports:
      - "${PORT}:3001"
    environment:
      TZ: "${TZ}"
    volumes:
      - data:/app/data
volumes:
  data:
