services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "${PORT}:80"
    environment:
      TZ: "${TZ}"
    volumes:
      - config:/config
      - metadata:/metadata
      - audiobooks:/audiobooks
      - podcasts:/podcasts
volumes:
  config:
  metadata:
  audiobooks:
  podcasts:
