services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1-rootless@sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 1g
    ports:
      - "${PORT}:3000"
      - "${SSH_PORT}:2222"
    volumes:
      - data:/var/lib/gitea
      - config:/etc/gitea
volumes:
  data:
  config:
