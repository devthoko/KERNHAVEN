services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.29.0@sha256:78eb28b8776d0bad40c5e605c72b3f4f5976793e491558c7dcbdfc04c835d4bc
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "${PORT}:9000"
    environment:
      ALLOW_SIGNUP: "false"
      TZ: "${TZ}"
    volumes:
      - data:/app/data
volumes:
  data:
