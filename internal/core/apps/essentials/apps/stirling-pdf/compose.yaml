services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:3.2.2@sha256:c6872dd056b0046a14c5de1e9970283e7f1e1ff685bb08090c6b37a231127d31
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${PORT}:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
    volumes:
      - configs:/configs
volumes:
  configs:
