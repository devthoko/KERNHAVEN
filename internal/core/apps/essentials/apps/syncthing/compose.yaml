services:
  syncthing:
    image: syncthing/syncthing:2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${PORT}:8384"
      - "${SYNC_PORT}:22000/tcp"
      - "${SYNC_PORT}:22000/udp"
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - data:/var/syncthing
volumes:
  data:
