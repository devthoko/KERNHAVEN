services:
  freshrss:
    image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${PORT}:80"
    environment:
      CRON_MIN: "*/20"
      TZ: "${TZ}"
    volumes:
      - data:/var/www/FreshRSS/data
      - extensions:/var/www/FreshRSS/extensions
volumes:
  data:
  extensions:
