services:
  jellyfin:
    image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${PORT}:8096"
    environment:
      TZ: "${TZ}"
    volumes:
      - config:/config
      - cache:/cache
      - media:/media
volumes:
  config:
  cache:
  media:
