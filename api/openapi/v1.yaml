openapi: 3.1.0
info:
  title: Kernhaven Core API
  version: 1.0.0-dev
  description: |
    Versioned REST API of kernhaven-core (ADR-0012). Every response carries the
    security headers listed in docs/milestones/M1-core-foundation.md and an
    `X-Request-ID` header.

    Authentication uses the session cookie `__Host-kh_session` (or
    `kh_session` for http://localhost development origins). Unsafe methods on
    authenticated routes require the `X-CSRF-Token` header with the token
    returned by login/session, and a same-origin `Origin` header when sent by a
    browser. Each operation documents its required permission in
    `x-permission`; `public` marks unauthenticated routes.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      x-permission: public
      security: []
      responses:
        "200": { description: Process is running, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /health/ready:
    get:
      operationId: getReadiness
      x-permission: public
      security: []
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
        "503": { description: A dependency is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /version:
    get:
      operationId: getVersion
      x-permission: system.read
      responses:
        "200": { description: Build information, content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /setup:
    get:
      operationId: getSetupStatus
      x-permission: public
      security: []
      responses:
        "200":
          description: Whether first-run setup is required
          content: { application/json: { schema: { type: object, required: [required], properties: { required: { type: boolean } } } } }
    post:
      operationId: completeSetup
      x-permission: public
      security: []
      description: Creates the first owner with the one-time setup token from the service journal and logs them in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              additionalProperties: false
              properties:
                token: { type: string }
                username: { $ref: "#/components/schemas/Username" }
                display_name: { type: string, maxLength: 64 }
                password: { type: string, minLength: 12 }
      responses:
        "201": { description: Owner created and logged in, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      operationId: login
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200": { description: Logged in; session cookie set, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      x-permission: self.manage
      responses:
        "204": { description: Logged out; cookie cleared }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/session:
    get:
      operationId: getSession
      x-permission: self.manage
      responses:
        "200": { description: Current session, content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/password:
    post:
      operationId: changeOwnPassword
      x-permission: self.manage
      description: Changes the caller's password and ends all of their other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12 }
      responses:
        "204": { description: Password changed }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/preferences:
    get:
      operationId: getPreferences
      x-permission: self.manage
      responses:
        "200": { description: The caller's preferences, content: { application/json: { schema: { $ref: "#/components/schemas/Preferences" } } } }
    put:
      operationId: setPreferences
      x-permission: self.manage
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Preferences" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Preferences" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /auth/sessions:
    get:
      operationId: listOwnSessions
      x-permission: self.manage
      responses:
        "200":
          description: The caller's active sessions
          content:
            application/json:
              schema: { type: object, properties: { sessions: { type: array, items: { $ref: "#/components/schemas/Session" } } } }
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      x-permission: self.manage
      description: Ends one session. Other users' sessions additionally require sessions.manage and are reported as 404 otherwise.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Session ended }
        "404": { $ref: "#/components/responses/Error" }
  /users:
    get:
      operationId: listUsers
      x-permission: users.read
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema: { type: object, properties: { users: { type: array, items: { $ref: "#/components/schemas/User" } } } }
    post:
      operationId: createUser
      x-permission: users.manage
      description: Admins may only create operators and viewers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role, password]
              additionalProperties: false
              properties:
                username: { $ref: "#/components/schemas/Username" }
                display_name: { type: string, maxLength: 64 }
                role: { $ref: "#/components/schemas/Role" }
                password: { type: string, minLength: 12 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /users/{id}:
    get:
      operationId: getUser
      x-permission: users.read
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateUser
      x-permission: users.manage
      description: Role or disabled changes end all sessions of the user. Nobody can change their own role or disable themselves; the last enabled owner is protected.
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: { type: string, maxLength: 64 }
                role: { $ref: "#/components/schemas/Role" }
                disabled: { type: boolean }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteUser
      x-permission: users.manage
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}/password:
    post:
      operationId: resetUserPassword
      x-permission: users.manage
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], additionalProperties: false, properties: { password: { type: string, minLength: 12 } } }
      responses:
        "204": { description: Password reset; the user's sessions ended }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /audit:
    get:
      operationId: listAuditEvents
      x-permission: audit.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Audit events, newest first
          content:
            application/json:
              schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /audit/verify:
    get:
      operationId: verifyAuditChain
      x-permission: audit.read
      responses:
        "200":
          description: Chain verification result
          content:
            application/json:
              schema:
                type: object
                required: [ok, records]
                properties:
                  ok: { type: boolean }
                  records: { type: integer }
                  broken_at: { type: integer }
                  reason: { type: string }
  /jobs:
    get:
      operationId: listJobs
      x-permission: jobs.read
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [queued, running, compensating, succeeded, failed, cancelled] } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Jobs, newest first
          content:
            application/json:
              schema: { type: object, properties: { jobs: { type: array, items: { $ref: "#/components/schemas/Job" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /jobs/{id}:
    get:
      operationId: getJob
      x-permission: jobs.read
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Job with step journal and logs, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      x-permission: jobs.manage
      description: Requests cancellation. Completed steps are rolled back where the job kind supports it. Audited.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "202": { description: Cancellation requested }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /system/agent:
    get:
      operationId: getAgentStatus
      x-permission: system.read
      description: Availability of the host agent and the Docker Engine behind it. Always 200; unavailability is reported in the body.
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/AgentStatus" } } } }
  /containers:
    get:
      operationId: listContainers
      x-permission: containers.read
      parameters: [{ name: all, in: query, schema: { type: boolean, default: true } }]
      responses:
        "200": { description: Containers, content: { application/json: { schema: { type: object, properties: { containers: { type: array, items: { type: object } } } } } } }
        "503": { $ref: "#/components/responses/Error" }
    post:
      operationId: createContainer
      x-permission: containers.manage
      description: Creates a container after policy evaluation in Core and agent. Exceptions require policy.exceptions (owners) and a reason; they are audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              additionalProperties: false
              properties:
                spec: { $ref: "#/components/schemas/ContainerSpec" }
                exceptions: { type: array, items: { type: object, required: [rule, reason], properties: { rule: { type: string }, reason: { type: string, minLength: 10, maxLength: 500 } } } }
                start: { type: boolean }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: string }, warnings: { type: array, items: { type: string } } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /containers/validate:
    post:
      operationId: validateContainer
      x-permission: containers.manage
      description: Policy preview for a container spec; changes nothing.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContainerSpec" } } } }
      responses:
        "200": { description: Evaluation, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyEvaluation" } } } }
  /containers/{id}:
    get:
      operationId: inspectContainer
      x-permission: containers.read
      parameters: [{ $ref: "#/components/parameters/ContainerID" }]
      responses:
        "200": { description: Security-relevant summary, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeContainer
      x-permission: containers.manage
      parameters:
        - { $ref: "#/components/parameters/ContainerID" }
        - { name: force, in: query, schema: { type: boolean } }
        - { name: volumes, in: query, schema: { type: boolean } }
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Error" }
  /containers/{id}/start:
    post:
      { operationId: startContainer, x-permission: containers.operate, parameters: [{ $ref: "#/components/parameters/ContainerID" }], responses: { "200": { $ref: "#/components/responses/Action" } } }
  /containers/{id}/stop:
    post:
      operationId: stopContainer
      x-permission: containers.operate
      parameters: [{ $ref: "#/components/parameters/ContainerID" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { timeout_seconds: { type: integer, minimum: 0, maximum: 300 } } } } } }
      responses: { "200": { $ref: "#/components/responses/Action" } }
  /containers/{id}/restart:
    post:
      operationId: restartContainer
      x-permission: containers.operate
      parameters: [{ $ref: "#/components/parameters/ContainerID" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { timeout_seconds: { type: integer, minimum: 0, maximum: 300 } } } } } }
      responses: { "200": { $ref: "#/components/responses/Action" } }
  /containers/{id}/pause:
    post:
      { operationId: pauseContainer, x-permission: containers.operate, parameters: [{ $ref: "#/components/parameters/ContainerID" }], responses: { "200": { $ref: "#/components/responses/Action" } } }
  /containers/{id}/unpause:
    post:
      { operationId: unpauseContainer, x-permission: containers.operate, parameters: [{ $ref: "#/components/parameters/ContainerID" }], responses: { "200": { $ref: "#/components/responses/Action" } } }
  /containers/{id}/logs:
    get:
      operationId: containerLogs
      x-permission: containers.operate
      description: Logs often contain secrets, so they need containers.operate.
      parameters:
        - { $ref: "#/components/parameters/ContainerID" }
        - { name: tail, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 200 } }
        - { name: since, in: query, schema: { type: integer } }
        - { name: until, in: query, schema: { type: integer } }
        - { name: timestamps, in: query, schema: { type: boolean } }
      responses:
        "200": { description: Log lines, content: { application/json: { schema: { type: object, properties: { lines: { type: array, items: { type: object, properties: { stream: { type: string }, text: { type: string } } } }, truncated: { type: boolean } } } } } }
  /images:
    get:
      operationId: listImages
      x-permission: containers.read
      responses: { "200": { description: Images, content: { application/json: { schema: { type: object } } } } }
  /images/pull:
    post:
      operationId: pullImage
      x-permission: containers.manage
      description: Starts an images.pull job; the job output records the resolved digest.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reference], properties: { reference: { type: string } } } } } }
      responses:
        "202": { description: Job queued, content: { application/json: { schema: { type: object, properties: { job_id: { type: integer } } } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /images/remove:
    post:
      operationId: removeImage
      x-permission: containers.manage
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reference], properties: { reference: { type: string }, force: { type: boolean } } } } } }
      responses: { "204": { description: Removed }, "409": { $ref: "#/components/responses/Error" } }
  /images/prune:
    post:
      operationId: pruneImages
      x-permission: containers.manage
      description: Removes dangling images only.
      responses: { "200": { description: Pruned, content: { application/json: { schema: { type: object, properties: { deleted: { type: integer }, space_reclaimed: { type: integer } } } } } } }
  /volumes:
    get:
      { operationId: listVolumes, x-permission: containers.read, responses: { "200": { description: Volumes, content: { application/json: { schema: { type: object } } } } } }
    post:
      operationId: createVolume
      x-permission: containers.manage
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, labels: { type: object } } } } } }
      responses: { "201": { description: Created } }
  /volumes/{name}:
    delete:
      operationId: removeVolume
      x-permission: containers.manage
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Removed }, "409": { $ref: "#/components/responses/Error" } }
  /networks:
    get:
      { operationId: listNetworks, x-permission: containers.read, responses: { "200": { description: Networks, content: { application/json: { schema: { type: object } } } } } }
    post:
      operationId: createNetwork
      x-permission: containers.manage
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, internal: { type: boolean }, labels: { type: object } } } } } }
      responses: { "201": { description: Created } }
  /networks/{name}:
    delete:
      operationId: removeNetwork
      x-permission: containers.manage
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Removed }, "409": { $ref: "#/components/responses/Error" } }
  /stacks:
    get:
      operationId: listStacks
      x-permission: containers.read
      responses:
        "200": { description: Stacks, content: { application/json: { schema: { type: object, properties: { stacks: { type: array, items: { $ref: "#/components/schemas/Stack" } } } } } } }
    post:
      operationId: createStack
      x-permission: containers.manage
      description: Creates a stack with revision 1. The Compose file must be valid and every policy violation covered by an exception (exceptions need policy.exceptions).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Stack" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { description: Invalid Compose file or uncovered policy violations (body includes the evaluation) }
  /stacks/validate:
    post:
      operationId: validateStack
      x-permission: containers.manage
      description: Parses and evaluates a Compose file with line-accurate errors and per-service policy findings. Changes nothing.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionInput" } } } }
      responses:
        "200": { description: Evaluation, content: { application/json: { schema: { $ref: "#/components/schemas/StackEvaluation" } } } }
  /stacks/import-url:
    post:
      operationId: importStackFromURL
      x-permission: containers.manage
      description: Downloads a Compose file from a public HTTPS URL (max 256 KiB) for review. Internal addresses are refused. Nothing is stored.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string } } } } } }
      responses:
        "200": { description: Content, content: { application/json: { schema: { type: object, properties: { compose: { type: string } } } } } }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /stacks/{name}:
    get:
      operationId: getStack
      x-permission: containers.read
      description: Stack, latest revision, variables (secret values omitted) and service runtime state.
      parameters: [{ $ref: "#/components/parameters/StackName" }]
      responses:
        "200": { description: Stack detail, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteStack
      x-permission: containers.manage
      parameters: [{ $ref: "#/components/parameters/StackName" }]
      responses:
        "204": { description: Deleted }
        "409": { description: Stack is deployed }
  /stacks/{name}/revisions:
    get:
      operationId: listStackRevisions
      x-permission: containers.read
      parameters: [{ $ref: "#/components/parameters/StackName" }]
      responses:
        "200": { description: Revisions, newest first, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: createStackRevision
      x-permission: containers.manage
      parameters: [{ $ref: "#/components/parameters/StackName" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionInput" } } } }
      responses:
        "201": { description: Revision created }
        "403": { $ref: "#/components/responses/Error" }
        "422": { description: Invalid or not deployable }
  /stacks/{name}/revisions/{number}:
    get:
      operationId: getStackRevision
      x-permission: containers.read
      parameters:
        - { $ref: "#/components/parameters/StackName" }
        - { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Revision with Compose content }
        "404": { $ref: "#/components/responses/Error" }
  /stacks/{name}/variables:
    put:
      operationId: setStackVariables
      x-permission: containers.manage
      description: Replaces all variables. A secret sent without a value keeps its stored value. Values are encrypted at rest; secrets are never returned.
      parameters: [{ $ref: "#/components/parameters/StackName" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { variables: { type: array, items: { $ref: "#/components/schemas/VariableInput" } } } } } } }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
  /stacks/{name}/deploy:
    post:
      operationId: deployStack
      x-permission: containers.manage
      description: Starts a stacks.deploy job. A failed deployment rolls back to the previously deployed revision.
      parameters: [{ $ref: "#/components/parameters/StackName" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { revision: { type: integer, description: "0 or omitted = latest" } } } } } }
      responses:
        "202": { description: Job queued, content: { application/json: { schema: { type: object, properties: { job_id: { type: integer } } } } } }
        "409": { $ref: "#/components/responses/Error" }
  /stacks/{name}/down:
    post:
      operationId: stackDown
      x-permission: containers.manage
      description: Starts a stacks.down job that removes the stack's containers and networks; volumes only with remove_volumes.
      parameters: [{ $ref: "#/components/parameters/StackName" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { remove_volumes: { type: boolean } } } } } }
      responses:
        "202": { description: Job queued }
        "409": { $ref: "#/components/responses/Error" }
  /catalog/sources:
    get:
      operationId: listCatalogSources
      x-permission: apps.read
      responses:
        "200": { description: Sources, content: { application/json: { schema: { type: object, properties: { sources: { type: array, items: { $ref: "#/components/schemas/CatalogSource" } } } } } } }
    post:
      operationId: addCatalogSource
      x-permission: catalog.manage
      description: Adds a catalog source with its Ed25519 trust key (ADR-0020). The URL is optional; without it, signed catalogs are uploaded. The source is synced separately.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogSourceInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogSource" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/sources/{id}:
    delete:
      operationId: removeCatalogSource
      x-permission: catalog.manage
      description: Removes the source and its catalog. Installed apps stay but no longer receive updates.
      parameters: [{ $ref: "#/components/parameters/SourceID" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /catalog/sources/{id}/sync:
    post:
      operationId: syncCatalogSource
      x-permission: catalog.manage
      description: Downloads the catalog from the source's public HTTPS URL and accepts it only if the signature verifies against the source's key, the serial does not go backwards and it has not expired. A rejected catalog changes nothing; the reason is recorded on the source.
      parameters: [{ $ref: "#/components/parameters/SourceID" }]
      responses:
        "200": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogSource" } } } }
        "422": { description: Rejected catalog (code catalog_rejected), blocked URL or source without URL, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /catalog/sources/{id}/upload:
    post:
      operationId: uploadCatalog
      x-permission: catalog.manage
      description: Accepts a signed catalog envelope as the request body, with the same checks as a sync. The server's max_body_bytes limits the size.
      parameters: [{ $ref: "#/components/parameters/SourceID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogEnvelope" } } } }
      responses:
        "200": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogSource" } } } }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/apps:
    get:
      operationId: browseCatalog
      x-permission: apps.read
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Matching apps and all categories
          content: { application/json: { schema: { type: object, properties: { apps: { type: array, items: { $ref: "#/components/schemas/CatalogListing" } }, categories: { type: array, items: { type: string } } } } } }
  /catalog/apps/{id}/{app}:
    get:
      operationId: getCatalogApp
      x-permission: apps.read
      description: The catalog entry with its configuration form and the policy disclosure Kernhaven computed from the Compose file.
      parameters:
        - { $ref: "#/components/parameters/SourceID" }
        - { name: app, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}$" } }
      responses:
        "200": { description: App, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogAppDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /apps:
    get:
      operationId: listApps
      x-permission: apps.read
      responses:
        "200": { description: Installed apps, content: { application/json: { schema: { type: object, properties: { apps: { type: array, items: { $ref: "#/components/schemas/App" } } } } } } }
    post:
      operationId: installApp
      x-permission: apps.manage
      description: Creates the app's managed stack from the catalog entry and queues its deployment. Apps that need policy exceptions require policy.exceptions and approve_exceptions.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InstallAppInput" } } } }
      responses:
        "202": { $ref: "#/components/responses/AppJob" }
        "403": { description: Exceptions need an owner's explicit approval (code approval_required), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{name}:
    get:
      operationId: getApp
      x-permission: apps.read
      description: Installed app with version history, configuration (secret values omitted) and the available update with image changes, new fields and new exceptions.
      parameters: [{ $ref: "#/components/parameters/StackName" }]
      responses:
        "200": { description: App, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/Error" }
  /apps/{name}/update:
    post:
      operationId: updateApp
      x-permission: apps.manage
      description: Deploys the catalog's version as a new revision with a pre-update volume snapshot; a failed deployment restores the volumes and the previous revision.
      parameters: [{ $ref: "#/components/parameters/StackName" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateAppInput" } } } }
      responses:
        "202": { $ref: "#/components/responses/AppJob" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: Already up to date or another operation is running, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{name}/remove:
    post:
      operationId: removeApp
      x-permission: apps.manage
      description: Removes the app's containers and networks. With delete_data the volumes are removed as well, which requires the user's current password.
      parameters: [{ $ref: "#/components/parameters/StackName" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { delete_data: { type: boolean }, password: { type: string } } } } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, properties: { job_id: { type: integer } } } } } }
        "403": { description: Wrong password (code reauthentication_failed), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /storage:
    get:
      operationId: getStorageInventory
      x-permission: storage.read
      description: Disks with partitions, file systems, usage, SMART health and their classification (system, in_use, managed, free) as determined by the storage service, plus Kernhaven's mounts.
      responses:
        "200": { description: Inventory, content: { application/json: { schema: { $ref: "#/components/schemas/StorageInventory" } } } }
        "503": { description: The storage service is not configured or not reachable (code storage_unavailable), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /storage/format:
    post:
      operationId: formatDisk
      x-permission: storage.manage
      description: Queues formatting a free disk with one GPT partition and a file system. Requires the disk's name as typed confirmation and the user's password. The storage service refuses the system disk, disks in use and disks whose serial, WWN or size no longer match. Never retried automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, size_bytes, fstype, label, confirm, password]
              properties:
                path: { type: string }
                serial: { type: string }
                wwn: { type: string }
                size_bytes: { type: integer }
                fstype: { type: string, enum: [ext4, xfs, btrfs] }
                label: { type: string, pattern: "^[A-Za-z0-9_-]{1,12}$" }
                confirm: { type: string, description: the disk's name, for example sdb }
                password: { type: string }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, properties: { job_id: { type: integer } } } } } }
        "403": { description: Wrong password (code reauthentication_failed), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { description: Missing or wrong confirmation (code confirmation_required), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /storage/mounts:
    post:
      operationId: mountFileSystem
      x-permission: storage.manage
      description: Mounts a file system of a non-system disk at <mount_root>/<name> through a persistent systemd mount unit (by UUID, nofail,nosuid,nodev).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [path, uuid, name], properties: { path: { type: string }, uuid: { type: string }, name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}$" } } } } }
      responses:
        "201": { description: Mounted, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedMount" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /storage/mounts/{name}:
    delete:
      operationId: unmountFileSystem
      x-permission: storage.manage
      description: Stops and removes a Kernhaven mount unit. A busy file system is reported (409), never forced.
      parameters: [{ name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}$" } }]
      responses:
        "204": { description: Unmounted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /files/roots:
    get:
      operationId: listFileRoots
      x-permission: files.read
      description: File roots the user may read (with free space and whether the user may write). Roots and their paths are configured in the storage service.
      responses:
        "200": { description: Roots, content: { application/json: { schema: { type: object, properties: { roots: { type: array, items: { $ref: "#/components/schemas/FileRoot" } } } } } } }
        "503": { $ref: "#/components/responses/Error" }
  /files/list:
    get:
      operationId: listFiles
      x-permission: files.read
      description: Lists a folder (at most 10 000 entries). Paths are relative to the root; traversal and symlink escapes are refused by the storage service (os.Root).
      parameters: [{ $ref: "#/components/parameters/FileRootQuery" }, { $ref: "#/components/parameters/FilePathQuery" }]
      responses:
        "200": { description: Listing, content: { application/json: { schema: { $ref: "#/components/schemas/FileListing" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /files/download:
    get:
      operationId: downloadFile
      x-permission: files.read
      description: Streams a file as attachment (application/octet-stream, nosniff, sandbox CSP). Audited.
      parameters: [{ $ref: "#/components/parameters/FileRootQuery" }, { $ref: "#/components/parameters/FilePathQuery" }]
      responses:
        "200": { description: File content, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
  /files/preview:
    get:
      operationId: previewFile
      x-permission: files.read
      description: First 256 KiB as text if valid UTF-8, or kind image for PNG/JPEG/GIF/WebP recognised by content, else binary.
      parameters: [{ $ref: "#/components/parameters/FileRootQuery" }, { $ref: "#/components/parameters/FilePathQuery" }]
      responses:
        "200": { description: Preview, content: { application/json: { schema: { type: object, properties: { name: { type: string }, size: { type: integer }, kind: { type: string, enum: [text, image, binary] }, text: { type: string }, truncated: { type: boolean } } } } } }
  /files/image:
    get:
      operationId: fileImage
      x-permission: files.read
      description: A PNG, JPEG, GIF or WebP image (max 50 MB) with its sniffed type, attachment disposition, nosniff and sandbox CSP. SVG and other content is refused.
      parameters: [{ $ref: "#/components/parameters/FileRootQuery" }, { $ref: "#/components/parameters/FilePathQuery" }]
      responses:
        "200": { description: Image, content: { image/png: { schema: { type: string, format: binary } } } }
        "415": { $ref: "#/components/responses/Error" }
  /files/mkdir:
    post:
      operationId: createFolder
      x-permission: files.write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FileRef" } } } }
      responses:
        "200": { description: Created }
        "409": { $ref: "#/components/responses/Error" }
  /files/rename:
    post:
      operationId: renameFile
      x-permission: files.write
      description: Renames or moves within one root; never overwrites.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [root, from, to], properties: { root: { type: string }, from: { type: string }, to: { type: string } } } } } }
      responses:
        "204": { description: Renamed }
        "409": { $ref: "#/components/responses/Error" }
  /files/copy:
    post:
      operationId: copyFiles
      x-permission: files.write
      description: Queues a recursive copy within or between roots (read access on the source, write access on the target); never overwrites; symlinks are skipped.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [root, from, to], properties: { root: { type: string }, from: { type: string }, to_root: { type: string }, to: { type: string } } } } } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, properties: { job_id: { type: integer } } } } } }
  /files/trash:
    get:
      operationId: listTrash
      x-permission: files.read
      parameters: [{ $ref: "#/components/parameters/FileRootQuery" }]
      responses:
        "200": { description: Trash items, newest first, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/TrashItem" } } } } } } }
    post:
      operationId: moveToTrash
      x-permission: files.write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FileRef" } } } }
      responses:
        "200": { description: Moved, content: { application/json: { schema: { $ref: "#/components/schemas/TrashItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /files/trash/restore:
    post:
      operationId: restoreFromTrash
      x-permission: files.write
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [root, id], properties: { root: { type: string }, id: { type: string } } } } } }
      responses:
        "200": { description: Restored, content: { application/json: { schema: { type: object, properties: { path: { type: string } } } } } }
        "409": { description: Something exists at the original path, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /files/trash/purge:
    post:
      operationId: purgeTrash
      x-permission: files.write
      description: Queues deleting one trash item (id) or the whole trash of the root (no id).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [root], properties: { root: { type: string }, id: { type: string } } } } } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, properties: { job_id: { type: integer } } } } } }
  /files/uploads:
    post:
      operationId: startUpload
      x-permission: files.write
      description: Starts a resumable upload of size bytes (at most files.max_upload_bytes) to root/path. Sessions expire after 24 hours.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [root, path, size], properties: { root: { type: string }, path: { type: string }, size: { type: integer } } } } } }
      responses:
        "201": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /files/uploads/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{32}$" } }]
    get:
      operationId: getUpload
      x-permission: files.write
      description: The session with the bytes received so far, to resume after an interruption.
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/UploadSession" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: uploadChunk
      x-permission: files.write
      description: Appends a chunk (at most 8 MiB) at offset, which must equal the bytes received so far.
      parameters: [{ name: offset, in: query, required: true, schema: { type: integer, minimum: 0 } }]
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        "200": { description: Received, content: { application/json: { schema: { type: object, properties: { received: { type: integer } } } } } }
        "409": { description: Offset does not continue the upload, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelUpload
      x-permission: files.write
      responses:
        "204": { description: Cancelled }
  /files/uploads/{id}/finish:
    post:
      operationId: finishUpload
      x-permission: files.write
      description: Moves the complete upload into place; never overwrites an existing file.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{32}$" } }]
      responses:
        "200": { description: Done, content: { application/json: { schema: { type: object, properties: { path: { type: string } } } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { description: Incomplete upload, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-kh_session
  parameters:
    FileRootQuery:
      name: root
      in: query
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}$" }
    FilePathQuery:
      name: path
      in: query
      schema: { type: string, maxLength: 4096 }
    SourceID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    StackName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}$" }
    ContainerID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$" }
    UserID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    FileRoot:
      type: object
      properties:
        name: { type: string }
        available: { type: boolean }
        free_bytes: { type: integer }
        total_bytes: { type: integer }
        writable: { type: boolean }
    FileRef:
      type: object
      required: [root, path]
      properties:
        root: { type: string }
        path: { type: string, maxLength: 4096, description: relative to the root }
    FileListing:
      type: object
      properties:
        path: { type: string }
        truncated: { type: boolean }
        entries:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string, enum: [file, dir, symlink, other] }
              size: { type: integer }
              mod_time: { type: string, format: date-time }
              mode: { type: string }
              uid: { type: integer }
              gid: { type: integer }
    TrashItem:
      type: object
      properties:
        id: { type: string }
        path: { type: string }
        is_dir: { type: boolean }
        size: { type: integer }
        deleted_at: { type: string, format: date-time }
        deleted_by: { type: string }
    UploadSession:
      type: object
      properties:
        id: { type: string }
        root: { type: string }
        path: { type: string }
        size: { type: integer }
        received: { type: integer }
        chunk_size: { type: integer }
    ManagedMount:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        unit: { type: string }
        what: { type: string }
        fstype: { type: string }
        active: { type: boolean }
    StorageInventory:
      type: object
      properties:
        mount_root: { type: string }
        formattable_fstypes: { type: array, items: { type: string } }
        smart_tool: { type: boolean }
        privileged: { type: boolean }
        mounts: { type: array, items: { $ref: "#/components/schemas/ManagedMount" } }
        disks:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              name: { type: string }
              model: { type: string }
              serial: { type: string }
              wwn: { type: string }
              transport: { type: string }
              size_bytes: { type: integer }
              rotational: { type: boolean }
              removable: { type: boolean }
              read_only: { type: boolean }
              class: { type: string, enum: [system, in_use, managed, free] }
              reason: { type: string }
              formattable: { type: boolean }
              smart: { type: object, properties: { available: { type: boolean }, passed: { type: boolean }, temperature_c: { type: integer }, power_on_hours: { type: integer }, message: { type: string } } }
              file_systems:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string }
                    name: { type: string }
                    type: { type: string }
                    fstype: { type: string }
                    label: { type: string }
                    uuid: { type: string }
                    size_bytes: { type: integer }
                    fs_size_bytes: { type: integer }
                    fs_used_bytes: { type: integer }
                    fs_available_bytes: { type: integer }
                    mountpoints: { type: array, items: { type: string } }
                    mount_name: { type: string }
                    mountable: { type: boolean }
    CatalogSource:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        public_key: { type: string, description: base64 Ed25519 public key }
        key_id: { type: string }
        serial: { type: integer }
        catalog_name: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
        synced_at: { type: [string, "null"], format: date-time }
        last_error: { type: string }
        app_count: { type: integer }
    CatalogSourceInput:
      type: object
      required: [name, public_key]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64 }
        url: { type: string, description: optional https URL }
        public_key: { type: string }
    CatalogEnvelope:
      type: object
      required: [format, payload, signature]
      properties:
        format: { type: string, const: kernhaven-catalog/v1 }
        key_id: { type: string }
        payload: { type: string, description: base64 of the catalog JSON }
        signature: { type: string, description: "base64 Ed25519 signature over 'kernhaven-catalog/v1\\n' + payload bytes" }
    CatalogListing:
      type: object
      properties:
        source_id: { type: integer }
        source_name: { type: string }
        app_id: { type: string }
        name: { type: string }
        version: { type: string }
        summary: { type: string }
        categories: { type: array, items: { type: string } }
        installed: { type: array, items: { type: string } }
    CatalogAppDetail:
      type: object
      properties:
        source: { $ref: "#/components/schemas/CatalogSource" }
        app: { type: object, description: The verified catalog entry (fields, compose, web, exceptions) }
        disclosure: { $ref: "#/components/schemas/AppDisclosure" }
        installed: { type: array, items: { type: string } }
        expired: { type: boolean }
    AppDisclosure:
      type: object
      properties:
        installable: { type: boolean }
        needs_approval: { type: boolean }
        problems: { type: array, items: { type: string } }
        services:
          type: array
          items:
            type: object
            properties:
              service: { type: string }
              image: { type: string }
              image_pinned: { type: boolean }
              user: { type: string }
              ports: { type: array, items: { type: string } }
              bind_mounts: { type: array, items: { type: string } }
              volumes: { type: array, items: { type: string } }
              capabilities: { type: array, items: { type: string } }
              devices: { type: array, items: { type: string } }
              privileged: { type: boolean }
              host_network: { type: boolean }
              violations: { type: array, items: { type: object } }
              warnings: { type: array, items: { type: object } }
              exceptions: { type: array, items: { type: object } }
    App:
      type: object
      properties:
        name: { type: string }
        app_id: { type: string }
        app_name: { type: string }
        source_id: { type: [integer, "null"] }
        source_name: { type: string }
        version: { type: string, description: version of the deployed revision }
        latest_version: { type: string }
        update_available: { type: boolean }
        status: { type: string }
        status_message: { type: string }
        deployed_revision: { type: integer }
        web_port: { type: integer }
        created_at: { type: string, format: date-time }
    InstallAppInput:
      type: object
      required: [source_id, app_id]
      additionalProperties: false
      properties:
        source_id: { type: integer }
        app_id: { type: string }
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}$", description: defaults to app_id }
        values: { type: object, additionalProperties: { type: string } }
        approve_exceptions: { type: boolean }
    UpdateAppInput:
      type: object
      additionalProperties: false
      properties:
        values: { type: object, additionalProperties: { type: string }, description: values for new fields; stored values are kept }
        approve_exceptions: { type: boolean }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
    Version:
      type: object
      required: [version, commit, build_date, go_version]
      properties:
        version: { type: string }
        commit: { type: string }
        build_date: { type: string }
        go_version: { type: string }
    Username:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]{2,31}$"
    Role:
      type: string
      enum: [owner, admin, operator, viewer]
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        locked: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SessionInfo:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions: { type: array, items: { type: string } }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
    Session:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
        ip: { type: string }
        user_agent: { type: string }
        current: { type: boolean }
    AuditEvent:
      type: object
      properties:
        seq: { type: integer }
        time: { type: string, format: date-time }
        actor_id: { type: integer }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        request_id: { type: string }
        ip: { type: string }
        details: { type: object, additionalProperties: { type: string } }
        prev_hash: { type: string }
        hash: { type: string }
    Preferences:
      type: object
      required: [theme]
      additionalProperties: false
      properties:
        theme: { type: string, enum: [system, light, dark] }
    AgentStatus:
      type: object
      properties:
        agent:
          type: object
          properties:
            available: { type: boolean }
            error: { type: string }
            info:
              type: object
              properties:
                version: { type: string }
                commit: { type: string }
                uptime_seconds: { type: integer }
        docker:
          type: object
          properties:
            available: { type: boolean }
            error: { type: string }
            info:
              type: object
              properties:
                server_version: { type: string }
                api_version: { type: string }
                negotiated_api_version: { type: string }
                os: { type: string }
                arch: { type: string }
                kernel_version: { type: string }
                rootless: { type: boolean }
                storage_driver: { type: string }
                containers: { type: integer }
                running: { type: integer }
                paused: { type: integer }
                stopped: { type: integer }
                images: { type: integer }
    ContainerSpec:
      type: object
      required: [name, image]
      additionalProperties: false
      properties:
        name: { type: string }
        image: { type: string }
        cmd: { type: array, items: { type: string } }
        entrypoint: { type: array, items: { type: string } }
        env: { type: array, items: { type: object, properties: { name: { type: string }, value: { type: string } } } }
        user: { type: string }
        working_dir: { type: string }
        ports: { type: array, items: { type: object, properties: { host_ip: { type: string }, host_port: { type: integer }, container_port: { type: integer }, protocol: { type: string, enum: [tcp, udp] } } } }
        mounts: { type: array, items: { type: object, properties: { type: { type: string, enum: [volume, bind, tmpfs] }, source: { type: string }, target: { type: string }, read_only: { type: boolean } } } }
        network_mode: { type: string }
        restart_policy: { type: string, enum: ["", "no", always, unless-stopped, on-failure] }
        labels: { type: object, additionalProperties: { type: string } }
        privileged: { type: boolean }
        cap_add: { type: array, items: { type: string } }
        cap_drop: { type: array, items: { type: string } }
        pid_mode: { type: string }
        ipc_mode: { type: string }
        uts_mode: { type: string }
        devices: { type: array, items: { type: string } }
        security_opt: { type: array, items: { type: string } }
        read_only_rootfs: { type: boolean }
        memory_bytes: { type: integer }
        nano_cpus: { type: integer }
    PolicyEvaluation:
      type: object
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
        violations: { type: array, items: { $ref: "#/components/schemas/PolicyFinding" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/PolicyFinding" } }
    PolicyFinding:
      type: object
      properties:
        rule: { type: string }
        field: { type: string }
        message: { type: string }
        exemptible: { type: boolean }
    Stack:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        latest_revision: { type: integer }
        deployed_revision: { type: integer }
        status: { type: string, enum: [new, deploying, deployed, failed, stopping, stopped] }
        status_message: { type: string }
        managed_by: { type: string, enum: ["", app], description: "app = belongs to an installed app; changed only through the app endpoints" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VariableInput:
      type: object
      required: [name, secret]
      properties:
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$" }
        value: { type: string, maxLength: 16384 }
        secret: { type: boolean }
    RevisionInput:
      type: object
      required: [compose]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}$" }
        compose: { type: string, maxLength: 262144 }
        comment: { type: string, maxLength: 500 }
        variables: { type: array, items: { $ref: "#/components/schemas/VariableInput" } }
        exceptions: { type: array, items: { type: object, properties: { service: { type: string }, rule: { type: string }, reason: { type: string } } } }
    StackEvaluation:
      type: object
      properties:
        valid: { type: boolean }
        deployable: { type: boolean }
        errors: { type: array, items: { type: object, properties: { line: { type: integer }, column: { type: integer }, path: { type: string }, message: { type: string } } } }
        services: { type: array, items: { type: object, properties: { service: { type: string }, container: { type: string }, image: { type: string }, violations: { type: array, items: { $ref: "#/components/schemas/PolicyFinding" } }, warnings: { type: array, items: { $ref: "#/components/schemas/PolicyFinding" } } } } }
    Job:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        state: { type: string, enum: [queued, running, compensating, succeeded, failed, cancelled] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        created_by: { type: integer }
        cancel_requested: { type: boolean }
        needs_attention: { type: boolean }
        error: { type: string }
        steps_done: { type: integer }
        steps_total: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        steps:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              name: { type: string }
              state: { type: string, enum: [pending, done, compensated] }
              completed_at: { type: string, format: date-time }
        logs:
          type: array
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              level: { type: string, enum: [info, warn, error] }
              message: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
  responses:
    AppJob:
      description: Queued
      content: { application/json: { schema: { type: object, properties: { app: { $ref: "#/components/schemas/App" }, job_id: { type: integer } } } } }
    Action:
      description: Action result
      content: { application/json: { schema: { type: object, properties: { id: { type: string }, changed: { type: boolean } } } } }
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: No valid session
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
