# Change gate G1 (docs/release/QUALITY-GATES.md). Actions are pinned by commit
# SHA (ADR-0014).
#
# Two depths:
# - quick: every push to a feature branch (lint, vulnerabilities, Go tests on
#   amd64 with the race detector, web build and tests, systemd units).
# - full: pull requests, pushes to main, nightly and manual runs add arm64,
#   Debian 13, real-Docker integration, browser end-to-end tests and fuzzing.
#   Nothing is merged to main without a green full run. A commit message
#   containing [full-ci] requests the full suite on a feature branch.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STATICCHECK_VERSION: v0.8.2
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  lint:
    name: lint and vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: secret scan
        run: |
          if git grep -nE -- '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' -- . ':!scripts/check.sh' ':!.github/workflows/ci.yml'; then
            echo "private key material found"; exit 1
          fi

  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # arm64 only in the full suite
        include: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')) && '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test with race detector
        run: scripts/go-test-ci.sh -race -count=1 ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/kernhaven-core ./cmd/kernhaven-core
      - name: smoke test binary
        run: ./bin/kernhaven-core version

  test-debian:
    name: test on debian 13 (${{ matrix.arch }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:13
    steps:
      - name: install base packages
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test as unprivileged user
        # Tests check file ownership and permissions; running as root would
        # mask permission bugs.
        run: |
          useradd --create-home tester
          chown -R tester "$GITHUB_WORKSPACE"
          su tester -c "export PATH=$(dirname "$(command -v go)"):\$PATH HOME=/home/tester; cd '$GITHUB_WORKSPACE' && git config --global --add safe.directory '$GITHUB_WORKSPACE' && scripts/go-test-ci.sh -count=1 ./..."

  systemd:
    name: systemd unit hardening
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install binary and unit
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/kernhaven-core ./cmd/kernhaven-core
          CGO_ENABLED=0 go build -trimpath -o bin/kernhaven-agent ./cmd/kernhaven-agent
          sudo install -m 0755 bin/kernhaven-core bin/kernhaven-agent /usr/bin/
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin kernhaven
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin kernhaven-agent
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin kernhaven-proxy
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin caddy
          getent group docker || sudo groupadd docker
      - name: Caddy binary from the distribution archive (not started as a service)
        run: |
          sudo apt-get update -qq
          cd "$RUNNER_TEMP" && apt-get download caddy && dpkg-deb -x caddy_*.deb caddy-pkg
          echo "KH_CADDY=$RUNNER_TEMP/caddy-pkg/usr/bin/caddy" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/caddy-pkg/usr/bin/caddy" version
          sudo install -m 0755 "$RUNNER_TEMP/caddy-pkg/usr/bin/caddy" /usr/bin/caddy
      - name: systemd-analyze verify
        run: systemd-analyze verify deploy/systemd/kernhaven-core.service deploy/systemd/kernhaven-agent.service deploy/systemd/kernhaven-storage.service deploy/systemd/kernhaven-files.service deploy/systemd/kernhaven-proxy.service deploy/systemd/kernhaven-caddy.service
      - name: systemd-analyze security (AT-F00-06, threshold 2.0)
        run: |
          systemd-analyze security --offline=true --threshold=20 deploy/systemd/kernhaven-core.service
          systemd-analyze security --offline=true --threshold=20 deploy/systemd/kernhaven-agent.service
          systemd-analyze security --offline=true --threshold=20 deploy/systemd/kernhaven-storage.service
          systemd-analyze security --offline=true --threshold=20 deploy/systemd/kernhaven-files.service
          systemd-analyze security --offline=true --threshold=20 deploy/systemd/kernhaven-proxy.service
          systemd-analyze security --offline=true --threshold=20 deploy/systemd/kernhaven-caddy.service

  web:
    name: web UI (typecheck, unit tests, build, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dependency audit
        run: npm audit --audit-level=high
      - name: forbid dangerouslySetInnerHTML (TH-04)
        run: "! grep -rn dangerouslySetInnerHTML src"

  e2e:
    name: end-to-end browser tests (Playwright + axe)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Caddy binary from the distribution archive (not started as a service)
        run: |
          sudo apt-get update -qq
          cd "$RUNNER_TEMP" && apt-get download caddy && dpkg-deb -x caddy_*.deb caddy-pkg
          "$RUNNER_TEMP/caddy-pkg/usr/bin/caddy" version
      - name: run end-to-end tests (with the runner's Docker Engine and Caddy)
        env:
          KH_E2E_REQUIRE_DOCKER: "1"
        run: KH_E2E_CADDY="$RUNNER_TEMP/caddy-pkg/usr/bin/caddy" scripts/e2e.sh
      - name: upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  integration:
    name: integration with real Docker (${{ matrix.arch }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Docker Engine
        run: docker version
      - name: agent integration tests (AT-M4-06)
        env:
          KH_DOCKER_SOCKET: /var/run/docker.sock
        run: scripts/go-test-ci.sh -count=1 -race -tags integration -v ./internal/agent/ ./internal/agent/docker/
      - name: Caddy binary from the distribution archive (not started as a service)
        run: |
          sudo apt-get update -qq
          cd "$RUNNER_TEMP" && apt-get download caddy && dpkg-deb -x caddy_*.deb caddy-pkg
          echo "KH_CADDY=$RUNNER_TEMP/caddy-pkg/usr/bin/caddy" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/caddy-pkg/usr/bin/caddy" version
      - name: generated Caddy configuration against real Caddy (AT-F11-01..03)
        run: scripts/go-test-ci.sh -count=1 -race -tags proxy_integration -v ./internal/agent/network/

  storage:
    name: storage and file services as root (loop device, systemd)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: file system tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xfsprogs btrfs-progs
      - name: install the storage service with its real unit
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/kernhaven-agent ./cmd/kernhaven-agent
          go test -c -tags storage_integration -o bin/storage.test ./internal/agent/
          sudo install -m 0755 bin/kernhaven-agent /usr/bin/
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin kernhaven-agent
          sudo mkdir -p /etc/kernhaven /srv/kernhaven
          sudo KH_STORAGE_KEYDIR=/etc/kernhaven bin/storage.test -test.run '^TestM9WriteKey$'
          printf 'role = "storage"\nsocket = "/run/kernhaven-storage/storage.sock"\nallowed_uids = [0]\ngrant_public_key = "/etc/kernhaven/agent-grant.pub"\nmount_root = "/srv/kernhaven"\nstorage_include_loop_devices = true\n' | sudo tee /etc/kernhaven/storage.toml
          printf 'role = "files"\nsocket = "/run/kernhaven-files/files.sock"\nallowed_uids = [0]\ngrant_public_key = "/etc/kernhaven/agent-grant.pub"\nmount_root = "/srv/kernhaven"\n' | sudo tee /etc/kernhaven/files.toml
          sudo cp deploy/systemd/kernhaven-storage.service deploy/systemd/kernhaven-files.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl start kernhaven-storage kernhaven-files
          systemctl is-active kernhaven-storage kernhaven-files
      - name: loop device as test disk
        run: |
          truncate -s 600M "$RUNNER_TEMP/disk.img"
          echo "LOOP=$(sudo losetup --find --partscan --show "$RUNNER_TEMP/disk.img")" >> "$GITHUB_ENV"
      - name: storage and file integration tests (AT-F06-01..03, AT-F07-01..03, TH-31, TH-32)
        run: |
          sudo KH_STORAGE_KEYDIR=/etc/kernhaven KH_STORAGE_SOCKET=/run/kernhaven-storage/storage.sock KH_FILES_SOCKET=/run/kernhaven-files/files.sock KH_STORAGE_LOOP="$LOOP" KH_STORAGE_ROOT=/srv/kernhaven \
            bin/storage.test -test.v -test.run '^(TestM9StorageService|TestM10FilesOnDisk)$' 2>&1 | tee storage-test.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: service log on failure
        if: failure()
        run: |
          sudo journalctl -u kernhaven-storage -u kernhaven-files --no-pager -o cat | tail -30 | while IFS= read -r l; do echo "::warning title=storage service log::${l}"; done || true
          grep -E -- '--- FAIL|_test.go:[0-9]+:' storage-test.log | head -20 | while IFS= read -r l; do echo "::error title=storage::${l}"; done || true
      - name: clean up
        if: always()
        run: sudo losetup -d "$LOOP" || true

  proxy:
    name: proxy and Caddy services with their real units (ports 80/443)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Caddy binary from the distribution archive (not started as a service)
        run: |
          sudo apt-get update -qq
          cd "$RUNNER_TEMP" && apt-get download caddy && dpkg-deb -x caddy_*.deb caddy-pkg
          echo "KH_CADDY=$RUNNER_TEMP/caddy-pkg/usr/bin/caddy" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/caddy-pkg/usr/bin/caddy" version
      - name: install the proxy and Caddy services with their real units
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/kernhaven-agent ./cmd/kernhaven-agent
          go test -c -tags proxy_service -o bin/proxy.test ./internal/agent/network/
          sudo install -m 0755 bin/kernhaven-agent /usr/bin/
          sudo install -m 0755 "$RUNNER_TEMP/caddy-pkg/usr/bin/caddy" /usr/bin/caddy
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin kernhaven-agent
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin kernhaven-proxy
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin caddy
          sudo mkdir -p /etc/kernhaven
          sudo KH_PROXY_KEYDIR=/etc/kernhaven bin/proxy.test -test.run '^TestM12WriteKey$'
          sudo install -m 0644 deploy/config/caddy.json /etc/kernhaven/caddy.json
          sed -e 's/^allowed_uids = .*/allowed_uids = [0]/' deploy/config/proxy.toml.example | sudo tee /etc/kernhaven/proxy.toml
          sudo cp deploy/systemd/kernhaven-caddy.service deploy/systemd/kernhaven-proxy.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl start kernhaven-caddy kernhaven-proxy
          systemctl is-active kernhaven-caddy kernhaven-proxy
      - name: only the proxy service can reach Caddy's admin socket
        run: |
          sudo ls -ld /run/kernhaven-caddy /run/kernhaven-caddy/admin.sock
          test "$(sudo stat -c %U:%G:%a /run/kernhaven-caddy)" = caddy:kernhaven-proxy:750
          ! sudo -u nobody curl -s --unix-socket /run/kernhaven-caddy/admin.sock http://kernhaven-proxy/config/
          ! sudo -u kernhaven-agent curl -s --unix-socket /run/kernhaven-caddy/admin.sock http://kernhaven-proxy/config/
          ! curl -s -m 2 http://127.0.0.1:2019/config/
      - name: routes through the real units (AT-F11-01..03)
        run: |
          sudo KH_PROXY_KEYDIR=/etc/kernhaven KH_PROXY_SOCKET=/run/kernhaven-proxy/proxy.sock KH_CADDY_ROOT=/var/lib/kernhaven-caddy/data/caddy/pki/authorities/local/root.crt \
            bin/proxy.test -test.v -test.run '^TestM12ProxyService$' 2>&1 | tee proxy-test.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Caddy did not touch the host's trust store
        run: "! ls /usr/local/share/ca-certificates | grep -i caddy"
      - name: service log on failure
        if: failure()
        run: |
          sudo journalctl -u kernhaven-caddy -u kernhaven-proxy --no-pager -o cat | tail -30 | while IFS= read -r l; do echo "::warning title=proxy service log::${l}"; done || true
          grep -E -- '--- FAIL|_test.go:[0-9]+:' proxy-test.log | head -20 | while IFS= read -r l; do echo "::error title=proxy::${l}"; done || true

  fuzz:
    name: fuzz agent protocol (60 s each)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz=FuzzVerify -fuzztime=60s ./internal/agentproto/
      - run: go test -run='^$' -fuzz=FuzzHandleOp -fuzztime=60s ./internal/agent/
